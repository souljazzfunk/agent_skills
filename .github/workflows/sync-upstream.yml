name: Sync upstream

# Merge janestreet/agent_skills master into this fork's master once a day.
# The fork adds only .claude-plugin/ and this workflow, so merges should not conflict.
# If one does, the job fails and nothing is pushed.

on:
  schedule:
    - cron: "17 21 * * *" # 06:17 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream/master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/janestreet/agent_skills.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with upstream/master ($(git rev-parse --short upstream/master))"
            exit 0
          fi
          git merge --no-edit upstream/master -m "Merge upstream janestreet/agent_skills master"
          git push origin HEAD:master
          echo "Merged upstream/master $(git rev-parse --short upstream/master)"
